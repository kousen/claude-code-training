<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Broadside: a printed sheet — paper, black ink, one printer's red */
    :root {
      --paper: #F3ECDF; --ink: #1B1712; --red: #A4251C; --muted: #5E5448; --faint: #CFC4B1;
      --fell: 'IM Fell English', Georgia, serif;
      --fell-sc: 'IM Fell English SC', Georgia, serif;
      --garamond: 'EB Garamond', Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      padding: 1rem; background: var(--paper); color: var(--ink); font-family: var(--garamond);
    }
    main {
      width: 100%; max-width: 60rem; min-width: 0; min-height: min(37.5rem, calc(100dvh - 2rem));
      display: flex; flex-direction: column; padding: clamp(1.5rem, 5vw, 3rem) clamp(1.25rem, 6vw, 4.5rem) 2.5rem;
    }

    /* Running head with a double rule under it */
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .25rem 1.5rem;
      padding-bottom: .6rem; border-bottom: 1px solid var(--ink);
      font-family: var(--fell-sc); font-size: 1.125rem; letter-spacing: .04em;
    }
    header h1 { margin: 0; font: inherit; }
    .double-rule { height: 3px; border-bottom: 1px solid var(--ink); }

    /* The line number hangs in the margin as a red roman numeral, set by a CSS counter */
    .verse {
      flex-grow: 1; display: grid; grid-template-columns: minmax(6rem, auto) minmax(0, 1fr);
      column-gap: 1rem; align-items: center; padding: 2rem 0;
      view-transition-name: verse;
    }
    #number { font-family: var(--fell); font-style: italic; font-size: 2.25rem; color: var(--red); }
    #number::before { content: counter(line, lower-roman) "."; }
    .verse.blank #number::before { content: none; } /* before load or after a failed one */
    #line { margin: 0; font-family: var(--fell); font-size: clamp(2rem, 1.1rem + 3.4vw, 3.625rem); line-height: 1.12; }
    #upcoming { margin: 1.4rem 0 0; font-family: var(--fell); font-style: italic; font-size: clamp(1.1rem, 1rem + .5vw, 1.45rem); color: var(--muted); min-height: 1.4em; }
    ::view-transition-old(verse), ::view-transition-new(verse) { animation-duration: .3s; }

    /* One tick per line: inked up to the current line */
    .progress { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    #ticks { flex-grow: 1; display: flex; gap: 6px; }
    #ticks span { flex-grow: 1; height: 3px; background: var(--faint); transition: background .3s; }
    #ticks span.done { background: var(--ink); }
    #counter { font-family: var(--fell-sc); font-size: 1.0625rem; white-space: nowrap; }

    footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; }
    .controls { display: flex; gap: .75rem; }
    button {
      height: 2.875rem; padding: 0 1.25rem; display: inline-flex; align-items: center; gap: .6rem;
      border: 1px solid var(--ink); border-radius: 0; background: transparent; color: var(--ink);
      font-family: var(--fell-sc); font-size: 1.1875rem; cursor: pointer; transition: background .15s;
    }
    button:hover:not(:disabled) { background: rgb(27 23 18 / .07); }
    button:disabled { opacity: .35; cursor: default; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
    #play { min-width: 8.5rem; justify-content: center; background: var(--ink); color: var(--paper); }
    #play:hover:not(:disabled) { background: #3A322A; }
    button svg { flex-shrink: 0; }

    .aside { display: flex; flex-direction: column; align-items: flex-end; gap: .25rem; font-size: 1rem; color: var(--muted); }
    .hint { margin: 0; }
    #open {
      height: auto; padding: 0; border: none; background: none; color: var(--red);
      font-family: var(--garamond); font-size: 1rem; text-decoration: underline; text-underline-offset: 3px;
    }
    #open:hover { background: none; color: #7A1A13; }
    @media (hover: none) { .hint { display: none; } } /* no keyboard hint on touch devices */

    @media (max-width: 540px) {
      .verse { grid-template-columns: minmax(0, 1fr); row-gap: .5rem; } /* numeral sits above the line */
      .controls { width: 100%; flex-wrap: wrap; }
      .controls button { flex: 1; justify-content: center; }
      #play { order: -1; flex-basis: 100%; } /* big Play on top, Previous/Next side by side below */
      .aside { align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) {
        animation: none !important; transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="title">Lyrics Display</h1>
      <span id="byline"></span>
    </header>
    <div class="double-rule"></div>
    <div class="verse blank">
      <div id="number" aria-hidden="true"></div>
      <div>
        <p id="line" aria-live="polite">Loading…</p>
        <p id="upcoming"></p>
      </div>
    </div>
    <div class="progress">
      <div id="ticks" aria-hidden="true"></div>
      <span id="counter"></span>
    </div>
    <footer>
      <div class="controls">
        <button id="prev" aria-keyshortcuts="ArrowLeft"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Previous</button>
        <button id="play" aria-keyshortcuts="Space">Play</button>
        <button id="next" aria-keyshortcuts="ArrowRight">Next<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m5 2 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
      <div class="aside">
        <p class="hint"><i>Space</i> to play · <i>← →</i> to turn the line</p>
        <button id="open">Open another text…</button>
        <input type="file" id="file" accept=".txt,text/plain" hidden>
      </div>
    </footer>
  </main>
  <script src="lyrics.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const PLAY_ICON = '<svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><path d="M1 1v12l10-6z" fill="currentColor"/></svg>';
    const PAUSE_ICON = '<svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><path d="M1 1h3.5v12H1zM7.5 1H11v12H7.5z" fill="currentColor"/></svg>';
    let lines = [], index = 0, timer = null, shown = -1;

    function render() {
      if (index !== shown) { // transition only on actual line changes, not Play/Pause toggles
        const swap = () => {
          $('line').textContent = lines[index];
          $('upcoming').textContent = lines[index + 1] ?? '';
          $('number').style.counterSet = `line ${index + 1}`;
          document.querySelector('.verse').classList.remove('blank');
        };
        // Native View Transitions API; browsers without it just swap instantly
        // Rapid key presses skip in-flight transitions; the swap still happens, so ignore the rejection
        document.startViewTransition ? document.startViewTransition(swap).ready.catch(() => {}) : swap();
        shown = index;
      }
      [...$('ticks').children].forEach((tick, i) => tick.classList.toggle('done', i <= index));
      $('counter').textContent = `Line ${index + 1} of ${lines.length}`;
      $('prev').disabled = index === 0;
      $('next').disabled = index === lines.length - 1;
      $('play').disabled = false; // may have been disabled by an earlier failed load
      $('play').innerHTML = timer ? `${PAUSE_ICON}Pause` : `${PLAY_ICON}Play`;
    }

    function go(delta) {
      index = Math.min(Math.max(index + delta, 0), lines.length - 1);
      render();
    }

    function stop() { clearTimeout(timer); timer = null; render(); }

    // A chain of timeouts rather than setInterval, because each line waits a different amount of time
    function scheduleNext() {
      timer = setTimeout(() => {
        if (index === lines.length - 1) return stop(); // Stops at the end; to loop instead, set index = -1
        go(1);
        scheduleNext();
      }, durationFor(lines[index]));
    }

    function togglePlay() {
      if (timer) return stop();
      if (index === lines.length - 1) index = 0; // replay from the top
      scheduleNext();
      render();
    }

    // Manual navigation cancels auto-play so the two don't fight
    $('prev').onclick = () => { if (timer) stop(); go(-1); };
    $('next').onclick = () => { if (timer) stop(); go(1); };
    $('play').onclick = togglePlay;

    const KEYS = { ' ': () => $('play').click(), ArrowRight: () => $('next').click(), ArrowLeft: () => $('prev').click() };
    document.addEventListener('keydown', e => {
      const action = KEYS[e.key];
      if (!action || e.metaKey || e.ctrlKey || e.altKey || !lines.length) return; // leave browser shortcuts alone
      e.preventDefault(); // stops page scroll, and stops Space also "clicking" whichever button has focus
      if (!e.repeat) action(); // holding Space shouldn't machine-gun play/pause
    });

    // A title like "Song — Artist (Year)" is split across the running head
    function showTitle(title) {
      const [name, ...rest] = title.split(' — ');
      $('title').textContent = name || 'Lyrics Display';
      $('byline').textContent = rest.join(' — ');
      document.title = title ? `${title} · Lyrics Display` : 'Lyrics Display';
    }

    function load(text) {
      const parsed = parseLyrics(text); // throws on empty input, before any state changes
      clearTimeout(timer); timer = null;
      lines = parsed.lines; index = 0; shown = -1;
      $('ticks').replaceChildren(...lines.map(() => document.createElement('span')));
      showTitle(parsed.title);
      render();
    }

    function fail(message) {
      clearTimeout(timer); timer = null; lines = [];
      $('line').textContent = message;
      $('upcoming').textContent = '';
      document.querySelector('.verse').classList.add('blank');
      $('ticks').replaceChildren(); $('counter').textContent = '';
      showTitle(''); // don't leave the previous song's details on screen
      document.querySelectorAll('.controls button').forEach(b => b.disabled = true);
    }

    // The file picker works even when the page is opened from file://, where fetch is blocked
    $('open').onclick = () => $('file').click();
    $('file').onchange = async () => {
      const file = $('file').files[0];
      if (!file) return;
      try { load(await file.text()); } catch (err) { fail(`Could not read ${file.name} (${err.message}).`); }
      $('file').value = ''; // so choosing the same file again still fires "change"
    };

    fetch('lyrics.txt')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(load)
      .catch(err => fail(`Could not load lyrics.txt (${err.message}). Use "Open another text…" below, or serve this folder over HTTP.`));
  </script>
</body>
</html>
