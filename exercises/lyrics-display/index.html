<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg1: #0f0a1e; --bg2: #2a1042; --card: rgba(255,255,255,.06); --border: rgba(255,255,255,.12);
    --fg: #f5f0ff; --muted: #b8a9d9; --accent: #c084fc; --accent2: #f472b6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
    font-family: Inter, system-ui, sans-serif; color: var(--fg);
    background: radial-gradient(ellipse at 20% 0%, #4c1d95 0%, transparent 55%),
                radial-gradient(ellipse at 80% 100%, #831843 0%, transparent 55%),
                linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
  }
  .card {
    width: min(100%, 620px); padding: clamp(1.5rem, 5vw, 3rem) clamp(1.25rem, 5vw, 2.5rem);
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    backdrop-filter: blur(20px); box-shadow: 0 25px 60px rgba(0,0,0,.45); text-align: center;
  }
  h1 { font: 500 .8rem/1 Inter, sans-serif; letter-spacing: .25em; text-transform: uppercase; color: var(--muted); margin: 0 0 1.5rem; }
  h1::before { content: "♪ "; color: var(--accent); }
  #line {
    font-family: "Playfair Display", Georgia, serif; font-size: clamp(1.4rem, 4.5vw, 2.25rem); font-style: italic; line-height: 1.35;
    min-height: 6rem; display: grid; place-items: center; margin: 0 0 1.25rem; text-wrap: balance;
    transition: opacity .25s ease, transform .25s ease;
  }
  #line.out { opacity: 0; transform: translateY(8px); }
  #progress { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; margin: 0 0 .6rem; }
  .bar { height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; margin-bottom: 1.75rem; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s ease; }
  .controls { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
  button {
    font: 500 .95rem Inter, sans-serif; padding: .7rem 1.4rem; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: rgba(255,255,255,.08); color: var(--fg);
    transition: background .2s, transform .1s;
  }
  button:hover:not(:disabled) { background: rgba(255,255,255,.16); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .35; cursor: default; }
  #play { min-width: 7rem; border: 0; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #1a0a2e; font-weight: 600; }
  #play:hover { filter: brightness(1.1); }
  .speed { display: flex; align-items: center; justify-content: center; gap: .6rem; margin-top: 1.5rem; font-size: .85rem; color: var(--muted); }
  .speed input { width: min(50%, 200px); accent-color: var(--accent); }
  #speedVal { font-variant-numeric: tabular-nums; min-width: 2.5rem; text-align: left; }
  .hint { color: var(--muted); font-size: .75rem; margin: 1.5rem 0 0; }
  kbd { font: inherit; padding: .1rem .4rem; margin: 0 .1rem; border: 1px solid var(--border); border-radius: 4px; background: rgba(255,255,255,.06); }
  @media (max-width: 420px) { .controls button { flex: 1 1 100%; } #play { order: -1; } }
</style>
<main class="card">
  <h1>Now Playing</h1>
  <p id="line">Loading…</p>
  <p id="progress"></p>
  <div class="bar"><div id="fill"></div></div>
  <div class="controls">
    <button id="prev">‹ Previous</button>
    <button id="play">Play</button>
    <button id="next">Next ›</button>
  </div>
  <label class="speed">Speed <input id="speed" type="range" min="0.5" max="5" step="0.5" value="2"> <span id="speedVal">2.0s</span></label>
  <p class="hint"><kbd>←</kbd><kbd>→</kbd> navigate &nbsp; <kbd>Space</kbd> play/pause &nbsp; <kbd>Home</kbd><kbd>End</kbd> first/last</p>
</main>
<script src="app.js"></script>
<script>
  let lines = [], i = 0, timer = null;
  const $ = id => document.getElementById(id);
  const show = () => {
    const el = $('line');
    el.classList.add('out');
    setTimeout(() => { el.textContent = lines[i] ?? ''; el.classList.remove('out'); }, 250);
    $('progress').textContent = `Line ${i + 1} of ${lines.length}`;
    $('fill').style.width = ((i + 1) / lines.length * 100) + '%';
  };
  const step = d => { i = wrap(i + d, lines.length); show(); };
  const stop = () => { clearInterval(timer); timer = null; $('play').textContent = 'Play'; };

  $('next').onclick = () => step(1);
  $('prev').onclick = () => step(-1);
  $('play').onclick = () => {
    if (timer) return stop();
    $('play').textContent = 'Pause';
    timer = setInterval(() => step(1), delay()); // loops via wrap()
  };
  const delay = () => $('speed').value * 1000;
  $('speed').oninput = () => {
    $('speedVal').textContent = Number($('speed').value).toFixed(1) + 's';
    if (timer) { stop(); $('play').click(); } // restart interval at new speed
  };
  document.addEventListener('keydown', e => {
    const keys = { ArrowRight: () => step(1), ArrowLeft: () => step(-1), Home: () => step(-i), End: () => step(lines.length - 1 - i),
                   ' ': () => $('play').click(), k: () => $('play').click() };
    if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
  });

  fetch('lyrics.txt')
    .then(r => r.ok ? r.text() : Promise.reject(r.status))
    .then(t => { lines = parseLyrics(t); show(); })
    .catch(e => { $('line').textContent = 'Could not load lyrics.txt (' + e + '). Serve over HTTP.'; });
</script>
