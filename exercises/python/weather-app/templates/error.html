{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
                <div class="background">
                    <img src="{{ url_for('static', filename='assets/404_error_background.jpg') }}" alt="" id="error-background">
                </div>
                <div class="change-button">
                    <img class="chevron-icon" src="{{ url_for('static', filename='assets/chevron-left.png') }}" alt="">
                    <a href="{{ url_for('home') }}"> CHANGE CITY </a>
                </div>
                <h2 id="error-text"> {{ message or "This city does not exist. Please try again." }} </h2>
{% endblock %}
