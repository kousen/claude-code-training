{% extends "base.html" %}
{% block title %}Weather App{% endblock %}
{% block content %}
                <div class="main-header">
                    <h1> Weather </h1>
                </div>
                <div class="background">
                    <img src="{{ url_for('static', filename='assets/weather-home-background.jpg') }}" alt="" class="desktop-background">
                </div>
                <div class="search-bar">
                    <img class="search-icon" src="{{ url_for('static', filename='assets/search.png') }}" alt="">
                    <form class="search" action="" autocomplete="off" method="post">
                        <input type="text" name="search" id="search" tabindex="1" placeholder="Search for a city" aria-label="Search for a city">
                    </form>
                </div>
{% endblock %}
