<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics Display</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    /* Teleprompter: the current line large, its neighbors dimmed above and below */
    :root {
      --bg: #0e0f13;
      --text: #f2efe6;
      --muted: #9ea2af;
      --border: #4a4e5c;
      --track: #2e313b;
      --accent: #f5b83d;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      padding: clamp(1.25rem, 4vw, 3.5rem);
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem 1.5rem;
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
    #counter, .hint { color: var(--muted); font-variant-numeric: tabular-nums; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(1.25rem, 4vw, 2.5rem);
      width: 100%;
      max-width: 65rem;
      margin: 0 auto;
    }
    .row {
      display: grid;
      grid-template-columns: 3.5rem minmax(0, 1fr); /* line-number gutter */
      align-items: baseline;
      min-height: 2.1rem; /* keeps the layout still on the first and last line */
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.125rem, 2.2vw, 1.625rem);
      line-height: 1.3;
      overflow-wrap: anywhere; /* a long unbroken word wraps instead of widening the page */
    }
    .row .n { font-size: 1rem; font-variant-numeric: tabular-nums; }
    .row.current {
      color: var(--text);
      font-size: clamp(1.9rem, 4.6vw, 3.6rem);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }
    .row.current .n { color: var(--accent); font-weight: 700; letter-spacing: 0; }

    /* The gap shrinks as the line count grows, reaching 0 (a continuous bar) once
       ticks would otherwise be under 4px wide. --count is set from the script. */
    #ticks {
      display: flex;
      gap: clamp(0px, calc((100% - var(--count, 1) * 4px) / var(--count, 1)), 6px);
      margin-bottom: 1.5rem;
    }
    #ticks span { flex: 1; height: 4px; border-radius: 2px; background: var(--track); transition: background 0.3s; }
    #ticks .done { background: var(--accent); }
    #ticks .now { background: var(--text); }

    .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem 1.5rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .hint { font-size: 0.875rem; }
    @media (hover: none) { .hint { display: none; } } /* touch devices have no keyboard */
    button {
      min-height: 48px;
      padding: 0 1.25rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font: 500 1rem "Space Grotesk", system-ui, sans-serif;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s, filter 0.15s;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button:disabled { opacity: 0.4; cursor: default; }
    #play { min-width: 7.75rem; border-color: var(--accent); background: var(--accent); color: var(--bg); font-weight: 700; }
    #play:hover:not(:disabled) { filter: brightness(1.1); }

    @media (max-width: 30rem) {
      .controls { width: 100%; }
      button { flex: 1; padding: 0 0.5rem; }
      #play { min-width: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Lyrics Display</h1>
    <span id="counter"></span>
  </header>

  <main>
    <p class="row" aria-hidden="true"><span class="n" id="prev-n"></span><span id="prev-line"></span></p>
    <p class="row current"><span class="n" id="number" aria-hidden="true"></span><span id="line" role="status">Loading…</span></p>
    <p class="row" aria-hidden="true"><span class="n" id="next-n"></span><span id="next-line"></span></p>
  </main>

  <footer>
    <div id="ticks" role="progressbar" aria-label="Progress" aria-valuemin="1"></div>
    <div class="bar">
      <div class="controls">
        <button id="prev">‹ Previous</button>
        <button id="play">Play</button>
        <button id="next">Next ›</button>
      </div>
      <span class="hint">Space to play or pause · arrow keys to step</span>
    </div>
  </footer>

  <script type="module">
    import { parseLyrics, createPlayer } from './lyrics.js';

    const $ = id => document.getElementById(id);
    const lineEl = $('line');
    const ticksEl = $('ticks');
    const prevBtn = $('prev');
    const playBtn = $('play');
    const nextBtn = $('next');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const pad = n => String(n).padStart(2, '0');

    let lines = [];
    let player; // playback state and timing live in lyrics.js

    function render() {
      const index = player.index;
      if (lineEl.textContent !== lines[index]) {
        lineEl.textContent = lines[index];
        if (!reduceMotion.matches) {
          document.querySelector('main').animate(
            [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }],
            { duration: 400, easing: 'ease-out' }
          );
        }
      }
      const last = lines.length - 1;
      $('number').textContent = pad(index + 1);
      $('prev-n').textContent = index > 0 ? pad(index) : '';
      $('prev-line').textContent = index > 0 ? lines[index - 1] : '';
      $('next-n').textContent = index < last ? pad(index + 2) : '';
      $('next-line').textContent = index < last ? lines[index + 1] : '';
      $('counter').textContent = `Line ${index + 1} of ${lines.length}`;
      ticksEl.setAttribute('aria-valuemax', lines.length);
      ticksEl.setAttribute('aria-valuenow', index + 1);
      ticksEl.setAttribute('aria-valuetext', `Line ${index + 1} of ${lines.length}`);
      [...ticksEl.children].forEach((tick, k) => {
        tick.className = k < index ? 'done' : k === index ? 'now' : '';
      });
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === last;
      playBtn.textContent = player.playing ? 'Pause' : 'Play';
      playBtn.disabled = lines.length < 2; // nothing to advance through
    }

    // player is undefined until lyrics.txt has loaded, hence the ?.
    prevBtn.addEventListener('click', () => player?.previous());
    nextBtn.addEventListener('click', () => player?.next());
    playBtn.addEventListener('click', () => player?.toggle());

    // A mouse or touch click (detail > 0) should not leave the button focused, or the
    // next Space would repeat that button instead of toggling playback. Buttons reached
    // with Tab keep focus, and Space activates them as on any other page.
    for (const btn of [prevBtn, playBtn, nextBtn]) {
      btn.addEventListener('click', e => { if (e.detail > 0) btn.blur(); });
    }

    // Keyboard shortcuts reuse the button handlers; click() is a no-op on a disabled button.
    const shortcuts = { ' ': playBtn, ArrowRight: nextBtn, ArrowLeft: prevBtn };
    document.addEventListener('keydown', e => {
      const btn = shortcuts[e.key];
      if (!btn || e.metaKey || e.ctrlKey || e.altKey) return; // leave Cmd+Left (browser back) etc. alone
      if (e.key === ' ' && e.target instanceof HTMLButtonElement) return; // the focused button handles Space itself
      e.preventDefault(); // no page scroll
      if (e.key === ' ' && e.repeat) return; // holding space shouldn't flicker play/pause
      btn.click();
    });

    fetch('lyrics.txt')
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.text();
      })
      .then(text => {
        lines = parseLyrics(text);
        if (!lines.length) throw new Error('lyrics.txt is empty');
        player = createPlayer(lines, render);
        const ticks = new DocumentFragment();
        lines.forEach(() => ticks.append(document.createElement('span')));
        ticksEl.replaceChildren(ticks);
        ticksEl.style.setProperty('--count', lines.length);
        render();
      })
      .catch(err => {
        lineEl.textContent = `Could not load lyrics.txt (${err.message}). Serve this folder with: python3 -m http.server`;
        [prevBtn, playBtn, nextBtn].forEach(b => b.disabled = true);
      });
  </script>
</body>
</html>
