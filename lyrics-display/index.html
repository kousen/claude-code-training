<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyrics Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12102a;
    --bg-glow: #2b1d5c;
    --card: rgba(255, 255, 255, 0.05);
    --text: #f4f1ff;
    --muted: #9b94c4;
    --accent: #f2b84b;       /* brass */
    --accent-dark: #c98f1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1rem;
    color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg-glow), var(--bg) 70%);
    font-family: "Playfair Display", Georgia, "Iowan Old Style", serif;
  }
  main {
    width: min(100%, 44rem);
    padding: clamp(1.5rem, 5vw, 3rem);
    border-radius: 1.25rem;
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 2rem 4rem rgba(0, 0, 0, 0.45);
    text-align: center;
  }
  h1 {
    margin: 0 0 1.5rem;
    font-size: 0.85rem;
    font-weight: normal;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
  }
  #line {
    margin: 0;
    min-height: 2.6em;
    font-size: clamp(1.4rem, 4.5vw, 2.4rem);
    font-style: italic;
    line-height: 1.3;
    text-wrap: balance;
  }
  #line.in { animation: rise 450ms ease-out; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(0.6rem); }
    to   { opacity: 1; transform: none; }
  }
  #progress {
    height: 3px;
    margin: 1.5rem auto 0.75rem;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    overflow: hidden;
  }
  #progress > div {
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 400ms ease;
  }
  #counter {
    margin: 0 0 1.5rem;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .controls { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 1rem;
    padding: 0.65rem 1.4rem;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 200ms, transform 150ms, opacity 200ms;
  }
  button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); transform: translateY(-1px); }
  button:disabled { opacity: 0.35; cursor: default; }
  #play {
    min-width: 7rem;
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: bold;
  }
  #play:hover:not(:disabled) { background: var(--accent-dark); }
  #hint { margin: 1.5rem 0 0; font-size: 0.75rem; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    #line.in { animation: none; }
    button, #progress > div { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>♪ Lyrics</h1>
  <p id="line">Loading…</p>
  <div id="progress"><div></div></div>
  <p id="counter"></p>
  <div class="controls">
    <button id="prev">◀ Previous</button>
    <button id="play">▶ Play</button>
    <button id="next">Next ▶</button>
  </div>
  <p id="hint">Space: play / pause &nbsp;·&nbsp; ← → : previous / next</p>
</main>

<script>
let lines = [], i = 0, timer = null;
const $ = id => document.getElementById(id);

function show() {
  const el = $('line');
  el.classList.remove('in');
  void el.offsetWidth;                 // restart the CSS animation
  el.textContent = lines[i];
  el.classList.add('in');
  $('counter').textContent = `${i + 1} / ${lines.length}`;
  $('progress').firstElementChild.style.width = `${(i + 1) / lines.length * 100}%`;
  $('prev').disabled = i === 0;
  $('next').disabled = i === lines.length - 1;
}

function next() { if (i < lines.length - 1) { i++; show(); } else stop(); }
function prev() { if (i > 0) { i--; show(); } }

function play() {
  if (timer) return stop();
  if (i === lines.length - 1) { i = 0; show(); }   // restart from top if already at the end
  timer = setInterval(next, 2000);
  $('play').textContent = '❚❚ Pause';
}
function stop() { clearInterval(timer); timer = null; $('play').textContent = '▶ Play'; }

$('prev').onclick = prev;
$('next').onclick = next;
$('play').onclick = play;
document.onkeydown = e => {
  const action = { ArrowLeft: prev, ArrowRight: next, ' ': play }[e.key];
  if (action) { e.preventDefault(); action(); }   // stop Space from also clicking a focused button
};

fetch('lyrics.txt')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => { lines = t.split('\n').filter(l => l.trim()); show(); })
  .catch(e => $('line').textContent = `Could not load lyrics.txt (${e.message}). Serve this folder over HTTP.`);
</script>
</body>
</html>
