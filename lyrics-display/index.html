<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics Display</title>
  <style>
    /* Stage at night: deep violet house lights, magenta and amber spots */
    :root {
      --bg: #120b1f;
      --spot: #3b1d5e;
      --card: rgb(30 20 48 / 0.85);
      --border: #46305f;
      --text: #fbf5ea;
      --muted: #b3a3c7;
      --accent: #ff4d8d;
      --accent-2: #ffb347;
      --glow: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1rem;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 50% 0%, var(--spot) 0%, var(--bg) 65%) fixed;
      color: var(--text);
    }
    main {
      width: min(46rem, 100%);
      padding: clamp(1.5rem, 5vw, 3rem) clamp(1.25rem, 5vw, 2.5rem) clamp(1.25rem, 4vw, 2rem);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.25rem, 3vw, 1.75rem);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgb(0 0 0 / 0.45), 0 0 80px rgb(255 77 141 / 0.08);
    }
    header { display: flex; align-items: center; gap: 0.75rem; }
    #number {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      color: var(--accent-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.25rem 0.8rem;
    }
    /* Equalizer bars: idle when paused, bouncing while playing */
    .eq { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
    .eq i {
      width: 4px;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(var(--accent-2), var(--accent));
      transform-origin: bottom;
      transform: scaleY(0.25);
    }
    .playing .eq i { animation: bounce 0.9s ease-in-out infinite alternate; }
    .eq i:nth-child(2) { animation-delay: -0.35s; }
    .eq i:nth-child(3) { animation-delay: -0.6s; }
    .eq i:nth-child(4) { animation-delay: -0.15s; }
    @keyframes bounce { to { transform: scaleY(1); } }

    #line {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: clamp(1.35rem, 1rem + 2.6vw, 2.4rem);
      font-style: italic;
      line-height: 1.4;
      letter-spacing: 0.005em;
      text-align: center;
      text-wrap: balance;
      min-height: 2.8em; /* room for two lines so the card doesn't jump */
      display: grid;
      place-items: center;
      margin: 0;
    }
    progress {
      width: 100%;
      height: 6px;
      appearance: none;
      border: 0;
      border-radius: 999px;
      overflow: hidden;
      background: var(--border);
      accent-color: var(--accent);
    }
    progress::-webkit-progress-bar { background: var(--border); }
    progress::-webkit-progress-value { background: var(--glow); transition: width 0.4s ease; }
    progress::-moz-progress-bar { background: var(--glow); }
    #counter {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }
    .controls { display: flex; gap: 0.75rem; }
    button {
      font: 500 1rem system-ui, -apple-system, "Segoe UI", sans-serif;
      min-width: 6.5rem;
      padding: 0.7rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s, filter 0.15s;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
    button:disabled { opacity: 0.35; cursor: default; }
    #play { background: var(--glow); border-color: transparent; color: #1a0f24; font-weight: 700; }
    #play:hover:not(:disabled) { filter: brightness(1.1); }

    .hint { color: var(--muted); font-size: 0.75rem; opacity: 0.8; }
    @media (hover: none) { .hint { display: none; } } /* touch devices have no keyboard */

    @media (max-width: 30rem) {
      main { border-radius: 14px; }
      .controls { width: 100%; gap: 0.5rem; }
      button { flex: 1; min-width: 0; padding: 0.8rem 0.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .playing .eq i { animation: none; transform: scaleY(0.7); }
      progress::-webkit-progress-value { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span id="number"></span>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </header>
    <p id="line" aria-live="polite">Loading…</p>
    <progress id="progress" value="0" max="1"></progress>
    <div id="counter"></div>
    <div class="controls">
      <button id="prev">Previous</button>
      <button id="play">Play</button>
      <button id="next">Next</button>
    </div>
    <small class="hint">Space to play or pause · ← → to step</small>
  </main>

  <script>
    const DELAY_MS = 2000;
    const lineEl = document.getElementById('line');
    const counterEl = document.getElementById('counter');
    const numberEl = document.getElementById('number');
    const progressEl = document.getElementById('progress');
    const prevBtn = document.getElementById('prev');
    const playBtn = document.getElementById('play');
    const nextBtn = document.getElementById('next');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

    let lines = [];
    let index = 0;
    let timer = null;

    function render() {
      if (lineEl.textContent !== lines[index]) {
        lineEl.textContent = lines[index];
        if (!reduceMotion.matches) {
          lineEl.animate(
            [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }],
            { duration: 400, easing: 'ease-out' }
          );
        }
      }
      numberEl.textContent = `#${index + 1}`;
      counterEl.textContent = `Line ${index + 1} of ${lines.length}`;
      progressEl.max = lines.length;
      progressEl.value = index + 1;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === lines.length - 1;
      playBtn.textContent = timer ? 'Pause' : 'Play';
      document.body.classList.toggle('playing', Boolean(timer));
    }

    function stop() {
      clearInterval(timer);
      timer = null;
    }

    function go(delta) {
      index = Math.min(Math.max(index + delta, 0), lines.length - 1);
      if (index === lines.length - 1) stop(); // auto-play ends on the last line
      render();
    }

    prevBtn.addEventListener('click', () => { stop(); go(-1); });
    nextBtn.addEventListener('click', () => { stop(); go(1); });
    playBtn.addEventListener('click', () => {
      if (timer) {
        stop();
      } else {
        if (index === lines.length - 1) index = 0; // replay from the top
        timer = setInterval(() => go(1), DELAY_MS);
      }
      render();
    });

    // Keyboard shortcuts reuse the button handlers; click() is a no-op on a disabled button.
    const shortcuts = { ' ': playBtn, ArrowRight: nextBtn, ArrowLeft: prevBtn };
    document.addEventListener('keydown', e => {
      const btn = shortcuts[e.key];
      if (!btn || e.metaKey || e.ctrlKey || e.altKey) return; // leave Cmd+Left (browser back) etc. alone
      e.preventDefault(); // no page scroll
      if (e.key === ' ' && e.repeat) return; // holding space shouldn't flicker play/pause
      btn.click();
    });
    // A focused button also fires its own click when space is released; cancel that
    // so space always means play/pause and never toggles twice.
    document.addEventListener('keyup', e => { if (e.key === ' ') e.preventDefault(); });

    fetch('lyrics.txt')
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.text();
      })
      .then(text => {
        lines = text.split('\n').map(l => l.trim()).filter(Boolean);
        if (!lines.length) throw new Error('lyrics.txt is empty');
        render();
      })
      .catch(err => {
        lineEl.textContent = `Could not load lyrics.txt (${err.message}). Serve this folder with: python3 -m http.server`;
        [prevBtn, playBtn, nextBtn].forEach(b => b.disabled = true);
      });
  </script>
</body>
</html>
